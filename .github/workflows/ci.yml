name: Build and Test

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --update-snapshots verify

  build-and-test-c89:
    # Keep in sync with SDK_VERSIONS in release.yml
    name: build-and-test (SDK 8.9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test against Connector SDK 8.9
        run: mvn --batch-mode --update-snapshots verify -Dversion.connectors=8.9.0

  build-and-test-c810:
    # Keep in sync with SDK_VERSIONS in release.yml
    name: build-and-test (SDK 8.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test against Connector SDK 8.10
        run: mvn --batch-mode --update-snapshots verify -Dversion.connectors=8.10.0
